name: Publish site

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Local hooks can be bypassed (web edits, --no-verify), so re-check here.
      - name: Commit hygiene check
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -eu
          want="stephen.j.newhouse@gmail.com"
          if git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then range="$BEFORE..$GITHUB_SHA"; else range="$GITHUB_SHA"; fi
          fail=0
          for c in $(git rev-list "$range"); do
            ae=$(git log -1 --format=%ae "$c"); ce=$(git log -1 --format=%ce "$c")
            case "$ae" in "$want"|6317143+snewhouse@users.noreply.github.com) ;; *) echo "::error::$c author $ae"; fail=1 ;; esac
            case "$ce" in "$want"|noreply@github.com) ;; *) echo "::error::$c committer $ce"; fail=1 ;; esac
            if grep -qiE 'co-authored-by[[:space:]]*:|claude-session[[:space:]]*:|noreply@anthropic\.com|generated with.*claude|^[[:space:]]*\[(aa-ma plan|ad-hoc)\]' <<<"$(git log -1 --format=%B "$c")"; then
              echo "::error::$c message has an attribution trailer or internal footer"; fail=1
            fi
          done
          exit $fail

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.5.57"

      - name: Render & publish to gh-pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
